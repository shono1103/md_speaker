name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # バージョンは package.json の packageManager から読ませる。
      # version 入力と併記すると action がエラーになる。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # タグと package.json の version がズレると
      # Tampermonkey の自動更新が動かなくなるため必ず一致させる。
      - name: Check version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG と package.json の $PKG が一致しません" >&2
            exit 1
          fi
          echo "version $PKG"

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/md-speaker.user.js \
            dist/md-speaker.meta.js \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
